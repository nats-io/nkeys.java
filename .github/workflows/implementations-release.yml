name: All Implementations Publish Release
permissions:
  contents: read
on:
  push:
    tags: [ 'impl/*' ]

jobs:
  build:
    strategy:
      matrix:
        tc: [ 17, 21, 25 ]
        impl: [ regular, lts, fips ]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.impl }}
    env:
      BUILD_EVENT: "release"
      TARGET_COMPATIBILITY: ${{ matrix.tc }}
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: current
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build, Sign and Publish Release
        run: |
          echo "Target Compatibility: JDK ${{ matrix.tc }}"
          echo "Implementation: ${{ matrix.impl }}"
          echo "Working Directory: $(pwd)"
          chmod +x gradlew
          ./gradlew clean compileJava publishToSonatype closeAndReleaseSonatypeStagingRepository
